on:
  push:
    branches:
      - main

permissions:
  contents: read

name: release-please

jobs:
  # The only job that sees MY_RELEASE_PLEASE_TOKEN. It must never install or
  # run dependency code: a compromised package would get the token.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN pushes the manifest version bump to the release PR branch;
      # release-please itself uses MY_RELEASE_PLEASE_TOKEN.
      contents: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out PR
        uses: actions/checkout@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0
      - name: Update plugin manifest version
        if: ${{ steps.release.outputs.pr }}
        run: |
            # Checkout release-please PR under automated account
            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git switch ${{ fromJson(steps.release.outputs.pr).headBranchName }}

            # Extract version from package.json
            version=$(jq -r .version package.json)
            major=$(echo $version | cut -d. -f1)
            minor=$(echo $version | cut -d. -f2)
            patch=$(echo $version | cut -d. -f3)
        
            # Update plugin manifest
            jq ".version.major = $major | .version.minor = $minor | .version.patch = $patch" public/manifest.json > manifest_tmp.json
            mv manifest_tmp.json public/manifest.json
        
            # Commit and push
            git add public/manifest.json
            git commit -m "chore: Update plugin manifest version to $version"
            git push

  # Installs and runs dependency code, so it gets no secrets and a read-only
  # token.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build plugin
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: PluginZip.zip
          if-no-files-found: error

  # Write access to attach the zip, but runs no dependency code.
  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
      - name: Upload plugin zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" ./PluginZip.zip
